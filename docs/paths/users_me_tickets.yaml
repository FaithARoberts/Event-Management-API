get:
  summary: returns current user's tickets
  tags:
    - Users
  parameters:
  security:
    - bearerAuth: []
  responses: 
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/Ticket.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '404': 
      $ref: ../components/responses/NotFound.yaml