get:
  summary: List all events
  tags:
    - Events
  parameters:
    - name: search
      in: query
      required: false
      description: search by parameters
      schema:
        type: string
        example: 'Concert'
    - name: sortBy
      in: query
      required: false
      description: parameter to sort by
      schema:
        type: string
        example: id
    - name: sortOrder
      in: query
      required: false
      description: ascending or descending
      schema:
        type: string
        example: asc
    - name: limit
      in: query
      required: false
      description: Maximum number of events to return
      schema:
        type: integer
        example: 100
    - name: offset
      in: query
      required: false
      description: number to offset results by from the start
      schema:
        type: integer
        example: 0
  security:
    - bearerAuth: []
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/Event.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
post:
  summary: Create new event
  tags:
    - Events
  parameters:
      - name: date
        in: query
        required: true
        description: date of the event
        schema:
          type: DateTime
          example: 1/1/25 11:11:11
      - name: name
        in: query
        required: true
        description: name of the event
        schema:
          type: string
          example: John Doe's Concert
      - name: venueId
        in: query
        required: true
        description: venue the event is taking place at
        schema:
          type: integer
          example: 1
  security:
    - bearerAuth: []
  responses:
    '201':
      description: Created Successfully
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/Event.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml