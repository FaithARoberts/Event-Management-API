get:
  summary: List all users
  tags:
    - Users
  parameters:
    - name: search
      in: query
      required: false
      description: search by parameters
      schema:
        type: string
        example: 'John'
    - name: sortBy
      in: query
      required: false
      description: parameter to sort by
      schema:
        type: string
        example: id
    - name: sortOrder
      in: query
      required: false
      description: ascending or descending
      schema:
        type: string
        example: asc
    - name: limit
      in: query
      required: false
      description: Maximum number of users to return
      schema:
        type: integer
        example: 100
    - name: offset
      in: query
      required: false
      description: number to offset results by from the start
      schema:
        type: integer
        example: 0
  security:
    - bearerAuth: []
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/User.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
post:
  summary: Create new User
  tags:
    - Users
  parameters:
      - name: firstName
        in: query
        required: true
        description: user's first name
        schema:
          type: string
          example: John
      - name: lastName
        in: query
        required: true
        description: user's last name
        schema:
          type: string
          example: Doe
      - name: email
        in: query
        required: true
        description: user's email
        schema:
          type: string
          example: johndoe@gmail.com
      - name: password
        in: query
        required: true
        description: password of new user
        schema:
          type: string
          example: 1234Doe
  responses:
    '201':
      description: Created Successfully
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/User.yaml
