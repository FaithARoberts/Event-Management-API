get:
  summary: return user by id
  tags:
    - Users
  parameters:
    - name: id
      in: path
      required: true
      description: id of user to return
      schema:
        type: integer
        example: 1
  security:
    - bearerAuth: []
  responses: 
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/User.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404': 
      $ref: ../components/responses/NotFound.yaml

put:
  summary: updates the details of user by id
  tags:
    - Users
  parameters:
    - name: id
      in: path
      required: true
      description: id of user to update
      schema:
        type: integer
        example: 1
    - name: firstName
      in: query
      required: false
      description: new user firstName
      schema:
        type: string
        example: John
    - name: lastName
      in: query
      required: false
      description: new user lastName
      schema:
        type: string
        example: Doe
    - name: email
      in: query
      required: false
      description: new user email
      schema:
        type: string
        example: johndoe@gmail.com
    - name: password
      in: query
      required: false
      description: new password
      schema:
        type: string
        example: 1234Doe
  security:
    - bearerAuth: []
  responses: 
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/User.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404': 
      $ref: ../components/responses/NotFound.yaml
delete:
  summary: deletes user by id
  tags:
    - Users
  parameters:
    - name: id
      in: path
      required: true
      description: id of user to delete
      schema:
        type: integer
        example: 1
  security:
    - bearerAuth: []
  responses: 
    '204':
      description: NO CONTENT
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404': 
      $ref: ../components/responses/NotFound.yaml