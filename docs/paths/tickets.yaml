get:
  summary: List all tickets
  tags:
    - Tickets
  parameters:
    - name: search
      in: query
      required: false
      description: search by parameters
      schema:
        type: string
        example: '01/11/11'
    - name: sortBy
      in: query
      required: false
      description: parameter to sort by
      schema:
        type: string
        example: id
    - name: sortOrder
      in: query
      required: false
      description: ascending or descending
      schema:
        type: string
        example: asc
    - name: limit
      in: query
      required: false
      description: Maximum number of tickets to return
      schema:
        type: integer
        example: 100
    - name: offset
      in: query
      required: false
      description: number to offset results by from the start
      schema:
        type: integer
        example: 0
  security:
    - bearerAuth: []
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/Ticket.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
post:
  summary: Create new ticket
  tags:
    - Tickets
  parameters:
      - name: eventId
        in: query
        required: true
        description: event the ticket belongs to
        schema:
          type: integer
          example: 1
      - name: admits
        in: query
        required: true
        description: the amount of people the ticket admits at the door
        schema:
          type: integer
          example: 2
  security:
    - bearerAuth: []
  responses:
    '201':
      description: Created Successfully
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/Ticket.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml